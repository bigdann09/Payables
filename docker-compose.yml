services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: payables
      POSTGRES_PASSWORD: payables
      POSTGRES_DB: payables
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["56379:6379"]
volumes:
  pgdata:
